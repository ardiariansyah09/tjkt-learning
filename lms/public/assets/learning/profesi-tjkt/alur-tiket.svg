<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" role="img" aria-labelledby="title desc"><title id="title">Alur penanganan awal tiket TJKT</title><desc id="desc">Enam langkah dari memperjelas laporan sampai pengujian hasil. Jika belum berhasil, pemeriksaan dilanjutkan; penyebab tidak ditebak tanpa bukti.</desc><rect width="640" height="760" rx="18" fill="#f1f5fa"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#087f8c"/></marker></defs><rect x="20" y="20" width="600" height="94" rx="12" fill="#12305a"/><text x="40" y="55" fill="white" font-family="sans-serif" font-size="23" font-weight="bold">1. Perjelas laporan</text><text x="40" y="88" fill="#e1ecfa" font-family="sans-serif" font-size="17">Apa yang gagal, di mana, dan sejak kapan?</text><path d="M320,116 V135" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="140" width="600" height="94" rx="12" fill="#12305a"/><text x="40" y="175" fill="white" font-family="sans-serif" font-size="23" font-weight="bold">2. Catat cakupan dan dampak</text><text x="40" y="208" fill="#e1ecfa" font-family="sans-serif" font-size="17">Satu perangkat, satu ruang, atau lebih luas?</text><path d="M320,236 V255" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="260" width="600" height="94" rx="12" fill="#12305a"/><text x="40" y="295" fill="white" font-family="sans-serif" font-size="23" font-weight="bold">3. Kumpulkan bukti berizin</text><text x="40" y="328" fill="#e1ecfa" font-family="sans-serif" font-size="17">Pisahkan hasil pengamatan dari dugaan.</text><path d="M320,356 V375" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="380" width="600" height="94" rx="12" fill="#12305a"/><text x="40" y="415" fill="white" font-family="sans-serif" font-size="23" font-weight="bold">4. Tentukan batas penanganan</text><text x="40" y="448" fill="#e1ecfa" font-family="sans-serif" font-size="17">Apa yang boleh dilakukan dan siapa yang berwenang?</text><path d="M320,476 V495" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="500" width="600" height="94" rx="12" fill="#12305a"/><text x="40" y="535" fill="white" font-family="sans-serif" font-size="23" font-weight="bold">5. Periksa atau eskalasi</text><text x="40" y="568" fill="#e1ecfa" font-family="sans-serif" font-size="17">Teruskan bukti bila perlu keahlian atau izin lain.</text><path d="M320,596 V615" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="620" width="600" height="94" rx="12" fill="#12305a"/><text x="40" y="655" fill="white" font-family="sans-serif" font-size="23" font-weight="bold">6. Uji dan dokumentasikan</text><text x="40" y="688" fill="#e1ecfa" font-family="sans-serif" font-size="17">Konfirmasi hasil; jika belum berhasil, lanjutkan pemeriksaan.</text></svg>