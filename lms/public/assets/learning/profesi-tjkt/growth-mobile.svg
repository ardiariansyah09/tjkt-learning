<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 480" role="img" aria-labelledby="title"><title id="title">KEMAJUAN DATANG DARI PERBAIKAN</title><rect width="380" height="480" rx="18" fill="#123c53"/><text x="20" y="27" fill="#a6f0e5" font-family="sans-serif" font-size="13">KEMAJUAN DATANG DARI PERBAIKAN</text><rect x="16" y="70" width="348" height="84" rx="12" fill="#fff"/><text x="30" y="98" fill="#087f78" font-family="sans-serif" font-size="16" font-weight="bold">1. COBA</text><text x="30" y="129" fill="#47627b" font-family="sans-serif" font-size="14">Buat keputusan awal</text><rect x="16" y="168" width="348" height="84" rx="12" fill="#fff"/><text x="30" y="196" fill="#087f78" font-family="sans-serif" font-size="16" font-weight="bold">2. PERIKSA</text><text x="30" y="227" fill="#47627b" font-family="sans-serif" font-size="14">Cari bukti dan umpan balik</text><rect x="16" y="266" width="348" height="84" rx="12" fill="#fff"/><text x="30" y="294" fill="#087f78" font-family="sans-serif" font-size="16" font-weight="bold">3. PERBAIKI</text><text x="30" y="325" fill="#47627b" font-family="sans-serif" font-size="14">Ubah strategi dengan alasan</text><rect x="16" y="364" width="348" height="84" rx="12" fill="#fff"/><text x="30" y="392" fill="#087f78" font-family="sans-serif" font-size="16" font-weight="bold">4. TERAPKAN</text><text x="30" y="423" fill="#47627b" font-family="sans-serif" font-size="14">Coba pada kasus baru</text></svg>