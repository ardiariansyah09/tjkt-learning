/* HEADER MODUL PENGENALAN JARINGAN */

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 28px;
  background: #103e63;
}

header > div {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}

header > div strong {
  font-size: 16px;
  color: #ffffff;
}

/* Tombol kembali ke portal */

header > a,
header > a:visited {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  padding: 10px 18px;
  border-radius: 10px;
  background: #ffffff;
  border: 1px solid #ffffff;
  color: #075985;
  font-size: 13px;
  font-weight: 700;
  text-decoration: none;
  transition: background .2s, transform .2s;
}

header > a:hover {
  background: #e0f2fe;
  color: #075985;
  transform: translateY(-1px);
}

header > a:focus-visible {
  outline: 3px solid #7dd3fc;
  outline-offset: 3px;
}

/* Label modul */

header .pill {
  display: inline-block;
  padding: 6px 12px;
  border-radius: 30px;
  background: #d9f3fa;
  color: #075985;
  font-size: 12px;
}

/* Tampilan HP */

@media (max-width: 600px) {
  header {
    padding: 14px 16px;
  }

  header > div {
    flex: 1;
    min-width: 0;
  }

  header > div strong {
    font-size: 14px;
  }

  header > a {
    padding: 9px 12px;
    font-size: 12px;
  }
}

const $=id=>document.getElementById(id);let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}};if(!state.passed)state.passed={};if(!state.scores)state.scores={};let current=0,selection=null,gameStep=0,gameScore=0,quiz=[],quizChoices={};const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};const el=(tag,text,cls)=>{let n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};function clientServerPassed(){try{const d=JSON.parse(localStorage.getItem('tjkt:client-server-sim:v1')||'{}');return Number(d.best||0)>=75}catch{return false}}function passed(i){return !!state.passed[lessons[i].id] && (i!==4 || clientServerPassed())}function unlocked(i){return i===0||passed(i-1)}function complete(score){const l=lessons[current];state.scores[l.id]=Math.max(score,state.scores[l.id]||0);if(score>=(current>=7?80:75)){state.passed[l.id]=true;$('status').textContent=`✓ Lulus! Skor ${score}/100. Materi berikutnya terbuka.`;$('status').className='feedback success'}else{$('status').textContent=`Skor ${score}/100. Minimal ${current>=7?80:75}. Silakan ulangi.`;$('status').className='feedback error'}save();drawNav();clientServerNotice();$('next').disabled=!passed(current)||current===lessons.length-1;if(current===8&&passed(8))showCertificateForm()}

function makeOptions(opts,callback){let wrap=el('div',undefined,'options');opts.forEach((opt,i)=>{let b=el('button',opt);b.type='button';b.onclick=()=>{wrap.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');callback(i)};wrap.append(b)});return wrap}
function render(){drawNav();const l=lessons[current];$('title').textContent=`${current+1}. ${l.name}`;$('subtitle').textContent=l.desc;let c=$('content');c.replaceChildren();c.append(el('p',l.intro));if(current<6&&window.renderDeepLesson)window.renderDeepLesson(c,current);$('status').textContent=passed(current)?`✓ Sudah lulus. Nilai terbaik: ${state.scores[l.id]}/100.`:'Kerjakan aktivitas untuk membuka tahap berikutnya.';$('status').className='feedback';$('check').hidden=false;$('check').disabled=false;$('check').textContent='Periksa Jawaban';$('next').disabled=!passed(current)||current===lessons.length-1;clientServerNotice();selection=null;
if(current===0){let d=el('div',undefined,'diagram');d.append(el('div','💻 PC A','node'),el('div',undefined,'line'),el('div','💻 PC B','node'));c.append(d)}
if(current===2){let d=el('div',undefined,'grid');[['LAN','Ruang / Gedung'],['MAN','Area metropolitan'],['WAN','Antarwilayah luas']].forEach(([a,b])=>{let t=el('div',undefined,'tile');t.append(el('strong',a),el('p',b));d.append(t)});c.append(d)}

if(current<6){c.append(el('h3','Cek Pemahaman'),el('p',l.q),makeOptions(l.opts,i=>selection=i));$('check').onclick=()=>{if(selection===null){$('status').textContent='Pilih jawaban terlebih dahulu.';return}complete(selection===l.answer?100:0)}}

function drawGame(c){if(window.renderCyberArcade){$('check').hidden=true;window.renderCyberArcade(c,score=>complete(score));return}c.replaceChildren();$('check').hidden=true;const challenges=[{title:'Game 1 · Network Match',desc:'Pilih perangkat yang menghubungkan beberapa komputer dalam satu LAN.',opts:['Switch','Keyboard','Monitor'],correct:0,pts:30},{title:'Game 2 · Network Route',desc:'Klik urutan jalur dari laptop ke website di internet.',path:['💻 Laptop','🔀 Switch','🌐 Router','🗄️ Server'],pts:40},{title:'Game 3 · Network Detective',desc:'PC bisa membuka website dengan alamat IP tetapi tidak dengan nama domain. Komponen apa yang perlu diperiksa?',opts:['DNS','Kecerahan layar','Mouse'],correct:0,pts:30}];if(gameStep>=3){c.append(el('h2',`🎮 Arcade selesai — ${gameScore}/100`),el('p','Target kelulusan: 80.'));let b=el('button','Simpan Nilai','btn');b.onclick=()=>complete(gameScore);c.append(b);let again=el('button','Ulangi Games','btn secondary');again.onclick=()=>{gameStep=0;gameScore=0;drawGame(c)};c.append(again);return}const g=challenges[gameStep];c.append(el('h2',g.title),el('p',g.desc));function done(ok){gameScore+=ok?g.pts:0;$('status').textContent=ok?`✓ Tantangan berhasil (+${g.pts})`:'Belum tepat. Lanjut ke tantangan berikutnya.';gameStep++;setTimeout(()=>drawGame(c),450)}if(g.path){let pos=0;let info=el('p','Urutan: Laptop → Switch → Router → Server');c.append(info);let d=el('div',undefined,'grid');['🌐 Router','🗄️ Server','💻 Laptop','🔀 Switch'].forEach(v=>{let b=el('button',v,'tile');b.onclick=()=>{if(v===g.path[pos]){pos++;b.disabled=true;b.classList.add('selected');info.textContent=`Langkah ${pos}/4 benar`;if(pos===4)done(true)}else done(false)};d.append(b)});c.append(d)}else c.append(makeOptions(g.opts,i=>done(i===g.correct)))}
function startQuiz(c){quiz=bank.map((q,i)=>({q,i})).sort(()=>Math.random()-.5).slice(0,10);quizChoices={};c.append(el('p','Pilih satu jawaban pada setiap soal. Soal diacak saat halaman dibuka ulang.'));quiz.forEach(({q},n)=>{let section=el('section');section.append(el('h3',`${n+1}. ${q[0]}`),makeOptions(q[1],i=>quizChoices[n]=i));c.append(section)});$('check').onclick=()=>{if(Object.keys(quizChoices).length!==quiz.length){$('status').textContent='Jawab semua soal sebelum mengirim.';return}const correct=quiz.filter(({q},i)=>quizChoices[i]===q[2]).length;complete(correct*10)};if(passed(8))showCertificateForm()}
